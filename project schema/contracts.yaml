contracts:
  shared_enums:
    - name: Product
      owner_module: mini_billing_backend
      values:
        - GAS
        - ELEC
      serialization:
        json_value: gas, elec
      validation:
        - Product.fromValue rejects unsupported product values with BillingValidationException.

    - name: ImportType
      owner_module: mini_billing_backend
      values:
        - USERS
        - PRICES
        - READINGS
      validation:
        - File import requests require one ImportType value.

    - name: UserRole
      owner_module: mini_billing_backend
      values:
        - USER
        - ADMIN
      authorization_rules:
        - USER can generate invoices and read only invoices for its own User.reference.
        - ADMIN can register users, import files, manage Billing Runs, read all invoices, read reports, and read audit and error logs.

    - name: BillingRunStatus
      owner_module: mini_billing_backend
      values:
        - NOT_STARTED
        - IN_PROGRESS
        - PAUSED
        - COMPLETED
        - FAILED

    - name: ErrorSeverity
      owner_module: mini_billing_backend
      values:
        - WARNING
        - ERROR
        - CRITICAL

    - name: ErrorStatus
      owner_module: mini_billing_backend
      values:
        - OPEN
        - RESOLVED

  identity_and_ownership_rules:
    - name: Internal entity id
      rule: Backend-generated entity ids are 32-character UUID strings without dashes.
      owner_module: mini_billing_backend
    - name: User reference
      rule: User.reference is the customer-facing identifier used by invoice lookup, reading import association, uploadedBy resolution, and frontend userId fields.
      owner_module: mini_billing_backend
    - name: Invoice ownership
      rule: Each Invoice belongs to one User; USER role access is limited to invoices whose Invoice.user.reference matches the authenticated user's reference.
      owner_module: mini_billing_backend
    - name: File import ownership
      rule: FileImport.uploadedBy references the User resolved from FileImportRequest.uploadedBy.
      owner_module: mini_billing_backend

  api_error_response_shape:
    owner_module: mini_billing_backend
    contract_name: BillingResponse
    shape:
      generatedInvoices: list of GeneratedInvoice
      errors: list of string
    usage:
      - GlobalExceptionHandler returns BillingResponse with empty generatedInvoices and one or more errors for validation, parsing, calculation, file, missing request data, constraint violation, and bad credentials failures.

  pagination_sorting_filtering:
    contract_name: PageResponse
    owner_module: mini_billing_backend
    fields:
      - content
      - number
      - size
      - totalElements
      - totalPages
      - first
      - last
    conventions:
      - Paginated endpoints accept Spring Pageable query parameters.
      - Sorting uses Spring Data sort query syntax.
      - Optional invoice filtering uses userId on GET /api/billing/invoices for ADMIN users.

  shared_api_payloads:
    - name: LoginRequest
      producer: mini_billing_frontend
      consumer: mini_billing_backend
      fields:
        username: nonblank string
        password: nonblank string

    - name: LoginResponse
      producer: mini_billing_backend
      consumer: mini_billing_frontend
      fields:
        token: JWT bearer token string
        tokenType: Bearer
        username: string
        role: UserRole
        reference: string

    - name: BillingRequest
      producer: mini_billing_frontend
      consumer: mini_billing_backend
      transport: multipart/form-data
      fields:
        periodStart: yy-MM string
        periodEnd: yy-MM string
        userId: nonblank User.reference string
        usersCsv: uploaded users CSV or XLSX file

    - name: FileImportRequest
      producer: mini_billing_frontend
      consumer: mini_billing_backend
      transport: multipart/form-data
      fields:
        type: ImportType
        uploadedBy: nonblank User.reference string
        priceList: optional integer
        fileImports: nonempty list of uploaded CSV or XLSX files

    - name: InvoiceResponse
      producer: mini_billing_backend
      consumer: mini_billing_frontend
      fields:
        documentDate: string
        documentNumber: string
        consumer: string
        reference: string
        totalAmount: decimal
        lines: list of InvoiceLineResponse

    - name: BillingRunRequest
      producer: mini_billing_frontend
      consumer: mini_billing_backend
      fields:
        periodStart: yy-MM string
        periodEnd: yy-MM string

    - name: BillingRunResponse
      producer: mini_billing_backend
      consumer: mini_billing_frontend
      fields:
        id: string
        periodStart: string
        periodEnd: string
        status: BillingRunStatus
        startedAt: string
        endedAt: nullable string
        startedBy: username string
        processedRecords: integer
        failedRecords: integer

  validation_rules:
    - name: Billing period format
      rule: periodStart and periodEnd must match yy-MM; periodEnd must not be before periodStart.
    - name: Uploaded file presence
      rule: Billing generation requires usersCsv; file import requires at least one fileImports part.
    - name: Price file naming
      rule: Price list inference accepts prices-{number}.csv or prices-{number}.xlsx.
    - name: CSV/XLSX positional formats
      rule: users files have 3 columns; readings files have 4 columns; prices files have 4 columns.
    - name: Price value
      rule: Price.price must be greater than 0 and less than or equal to 1000.
    - name: Measurement quantity
      rule: QuantityMeasurement.quantity must be greater than 0 and less than or equal to 1000000.

  cross_module_event_contracts:
    - name: none
      rule: No asynchronous event contracts exist in the current architecture.
